# =================================================
# 운영(서버) 배포용 compose
#   개발용 docker-compose.yml 과 분리. 빌드된 산출물로 띄운다.
#     backend = Dockerfile.prod(실행 jar) / web = Dockerfile.prod(Vite 빌드 + Caddy)
#   외부 노출은 web(:80) 하나뿐. mysql/redis/backend 는 내부 네트워크로만 접근.
#
#   실행:  docker compose -f docker-compose.prod.yml up -d --build
# =================================================
services:
  mysql:
    image: mysql:8.4
    container_name: tripcrew-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tripcrew}
      TZ: Asia/Seoul
    # 메모리 작은 인스턴스(t2.micro 1GB) 대비 풋프린트 축소. 큰 인스턴스면 올려도 됨.
    command: ["--innodb-buffer-pool-size=64M", "--performance-schema=OFF"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: tripcrew-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    image: ${IMAGE_PREFIX:-tripcrew}/tripcrew-backend:latest
    # EC2 는 amd64. (로컬 빌드→푸시 방식 쓸 때 Apple Silicon 에서도 amd64 로 빌드되게 고정)
    platform: linux/amd64
    build:
      context: ./tripcrew-backend
      dockerfile: Dockerfile.prod
    container_name: tripcrew-backend
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_URL: ${DB_URL:-jdbc:mysql://mysql:3306/tripcrew?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      # 사용자가 접속하는 origin. WS 핸드셰이크 origin 검증에 사용(REST 는 같은 origin 이라 무관).
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:?APP_CORS_ORIGINS is required}
      # 업로드 이미지 영속 경로 (아래 uploads 볼륨에 보존)
      UPLOAD_DIR: /app/uploads
      NAVER_MAP_CLIENT_ID: ${NAVER_MAP_CLIENT_ID:-}
      NAVER_MAP_CLIENT_SECRET: ${NAVER_MAP_CLIENT_SECRET:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY is required}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      # 1GB 인스턴스 기준 하드캡. 더 큰 인스턴스면 .env 에서 올린다(예: -Xmx768m).
      JAVA_OPTS: ${JAVA_OPTS:--Xmx384m}
      # OAuth2 소셜 로그인(Kakao/Naver). 실제 키는 .env 에. 미설정이면 placeholder 로 기동(소셜만 비활성).
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-placeholder-kakao}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-placeholder-naver}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-placeholder-secret}
      # 소셜 로그인 성공 후 돌아갈 프론트 콜백 베이스(운영 도메인)
      APP_OAUTH_REDIRECT_BASE: ${APP_OAUTH_REDIRECT_BASE:-https://tripcrew.duckdns.org}
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped

  web:
    image: ${IMAGE_PREFIX:-tripcrew}/tripcrew-web:latest
    platform: linux/amd64
    build:
      context: ./tripcrew-frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_NAVER_MAP_CLIENT_ID: ${VITE_NAVER_MAP_CLIENT_ID:-}
    container_name: tripcrew-web
    depends_on:
      - backend
    ports:
      - "80:80"
      # HTTPS: Caddy 가 Let's Encrypt 인증서 자동 발급(Caddyfile 의 도메인 사용)
      - "443:443"
    # ⚠️ Caddy 인증서/ACME 계정 영속화 — 없으면 컨테이너 재생성(재빌드) 때마다
    #    인증서가 날아가 Let's Encrypt 에 재발급 요청 → 발급 실패/레이트리밋 위험.
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  mysql-data:
  uploads:
  caddy_data:
  caddy_config:
