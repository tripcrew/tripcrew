<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="TripCrew">
  <defs>
    <linearGradient id="tc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15876B"/>
      <stop offset="0.55" stop-color="#0F6E56"/>
      <stop offset="1" stop-color="#0A503E"/>
    </linearGradient>
    <radialGradient id="tc-glow" cx="0.3" cy="0.22" r="0.85">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="tc-pinshadow" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#06231B" flood-opacity="0.30"/>
    </filter>
  </defs>

  <!-- 배경 스퀘어클 -->
  <rect x="0" y="0" width="512" height="512" rx="120" fill="url(#tc-bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="120" fill="url(#tc-glow)"/>

  <!-- 여정 경로(점선) + 양 끝점 -->
  <path d="M104 362 Q256 300 408 362" fill="none" stroke="#FFFFFF" stroke-opacity="0.34"
        stroke-width="14" stroke-linecap="round" stroke-dasharray="2 34"/>
  <circle cx="104" cy="362" r="13" fill="#FFFFFF" fill-opacity="0.85"/>
  <circle cx="408" cy="362" r="13" fill="#FFFFFF" fill-opacity="0.85"/>

  <!-- 지도 핀(목적지) -->
  <g filter="url(#tc-pinshadow)">
    <path transform="translate(76 80) scale(15)"
          d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"
          fill="#FFFFFF"/>
  </g>
  <!-- coral 점(브랜드 도트) -->
  <circle cx="256" cy="215" r="40" fill="#D85A30"/>
  <circle cx="244" cy="203" r="12" fill="#FFFFFF" fill-opacity="0.35"/>
</svg>
