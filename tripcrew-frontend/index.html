<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>TripCrew — 함께 만드는 여행 계획</title>
    <!-- 테마 선적용(FOUC 방지): CSS·앱이 로드되기 전에 data-theme 을 확정한다.
         기본은 라이트. 사용자가 직접 다크로 토글한 적 있으면(저장값='dark') 그것만 존중. useTheme.js 와 키('tripcrew-theme') 동일. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('tripcrew-theme');
          // 저장값 없으면 라이트 기본(시스템 설정 무시). 명시적 'dark' 저장만 다크.
          var dark = saved === 'dark';
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
