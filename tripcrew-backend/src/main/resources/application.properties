# =================================================
# SERVER
# =================================================
server.port=8080

# =================================================
# CORS / WebSocket 허용 origin
#   개발 기본값은 로컬 Vite(5173). 운영에서는 APP_CORS_ORIGINS 로 실제 도메인/IP 주입.
#   콤마로 여러 개: APP_CORS_ORIGINS=http://1.2.3.4,https://tripcrew.example.com
# =================================================
app.cors.allowed-origins=${APP_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# =================================================
# DATABASE (DataSource)
#   접속 정보는 git 에 올리지 않는다. 로컬에서 환경변수로 주입:
#     export DB_USERNAME=root
#     export DB_PASSWORD=yourpassword
#   사전 준비: MySQL 8 에 `tripcrew` 스키마 생성 (CREATE DATABASE tripcrew ...)
# =================================================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# allowPublicKeyRetrieval: MySQL 8/9 기본 인증(caching_sha2_password)을 비-SSL 로컬에서 붙기 위해 필요
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tripcrew?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# =================================================
# 파일 업로드 (F08 후기 이미지)
#   로컬 파일시스템 저장. UPLOAD_DIR 미지정 시 작업디렉터리의 uploads/ 사용.
#   도커에서는 /app 가 호스트에 바인드 마운트되어 컨테이너 재시작에도 보존된다.
# =================================================
app.upload.dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=60MB

# =================================================
# Redis (최근 1시간 관광지 랭킹)
# =================================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# =================================================
# MyBatis
# =================================================
# mapper XML 위치 (feature 별로 mappers/ 아래 둔다)
mybatis.mapper-locations=classpath:mappers/**/*.xml
# DTO 별칭 자동 등록
mybatis.type-aliases-package=com.tripcrew
# DB snake_case 컬럼 <-> Java camelCase 필드 자동 매핑 (created_at -> createdAt)
mybatis.configuration.map-underscore-to-camel-case=true

# =================================================
# Flyway (DB 마이그레이션)
#   src/main/resources/db/migration/V1__init.sql 부터 순차 적용
# =================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# =================================================
# JWT (F01) - 시크릿/만료는 환경변수로 주입
#   export JWT_SECRET=<base64-256bit-key>
# =================================================
jwt.secret=${JWT_SECRET:}
# access token 만료 (ms) - 기본 30분
jwt.access-token-expiration=${JWT_ACCESS_EXP:1800000}
# refresh token 만료 (ms) - 기본 14일
jwt.refresh-token-expiration=${JWT_REFRESH_EXP:1209600000}

# =================================================
# NAVER Maps Directions 5
#   REST API 키는 프론트에 노출하지 않고 백엔드 환경변수로 주입한다.
# =================================================
naver.maps.client-id=${NAVER_MAP_CLIENT_ID:}
naver.maps.client-secret=${NAVER_MAP_CLIENT_SECRET:}
naver.maps.directions-url=${NAVER_DIRECTIONS_URL:https://maps.apigw.ntruss.com/map-direction/v1/driving}

# =================================================
# Gemini API
gemini.max-output-tokens=${GEMINI_MAX_OUTPUT_TOKENS:1024}
#   API 키는 프론트에 노출하지 않고 백엔드 환경변수로 주입한다.
# =================================================
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.1-flash-lite}
gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
