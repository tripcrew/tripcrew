# =================================================
# SERVER CONFIGURATION
# =================================================
# 서버 포트 설정
server.port=8080

# =================================================
# VIEW RESOLVER CONFIGURATION (JSP)
# =================================================
# JSP 파일의 위치를 지정합니다.
spring.mvc.view.prefix=/WEB-INF/views/
# JSP 파일의 확장자를 지정합니다.
spring.mvc.view.suffix=.jsp

# =================================================
# DATABASE CONNECTION (DataSource)
# =================================================
# TODO: [DB 연결 설정] 사용하시는 DB의 종류에 맞게 driver-class-name을 설정하세요. (예: com.mysql.cj.jdbc.Driver)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# TODO: [DB 연결 설정] 로컬 DB 서버 주소와 데이터베이스 이름을 입력하세요. (예: jdbc:mysql://localhost:3306/enjoytrip_db?useSSL=false&serverTimezone=UTC)
spring.datasource.url=jdbc:mysql://localhost:3306/tripcrew?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
# TODO: [DB 연결 설정] DB 접속 아이디를 입력하세요.
spring.datasource.username=${DB_USERNAME:root}
# TODO: [DB 연결 설정] DB 접속 비밀번호를 입력하세요.
spring.datasource.password=${DB_PASSWORD:}

# =================================================
# MYBATIS CONFIGURATION
# =================================================
# MyBatis Mapper XML 파일들의 위치를 지정합니다.
# src/main/resources/mappers/ 폴더 아래의 모든 xml 파일을 인식합니다.
mybatis.mapper-locations=classpath:mappers/*.xml
# DTO 클래스의 전체 패키지 경로를 지정하여, XML에서 짧은 별칭으로 사용할 수 있게 합니다.
# (예: com.enjoytrip.attraction.AttractionDto -> AttractionDto)
mybatis.type-aliases-package=com.enjoytrip.attraction, com.enjoytrip.member, com.enjoytrip.tripplan
