# =================================================
# SERVER
# =================================================
server.port=8080

# =================================================
# CORS / WebSocket 허용 origin
#   개발 기본값은 로컬 Vite(5173). 운영에서는 APP_CORS_ORIGINS 로 실제 도메인/IP 주입.
#   콤마로 여러 개: APP_CORS_ORIGINS=http://1.2.3.4,https://tripcrew.example.com
# =================================================
app.cors.allowed-origins=${APP_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# =================================================
# DATABASE (DataSource)
#   접속 정보는 git 에 올리지 않는다. 로컬에서 환경변수로 주입:
#     export DB_USERNAME=root
#     export DB_PASSWORD=yourpassword
#   사전 준비: MySQL 8 에 `tripcrew` 스키마 생성 (CREATE DATABASE tripcrew ...)
# =================================================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# allowPublicKeyRetrieval: MySQL 8/9 기본 인증(caching_sha2_password)을 비-SSL 로컬에서 붙기 위해 필요
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tripcrew?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# =================================================
# 파일 업로드 (F08 후기 이미지)
#   로컬 파일시스템 저장. UPLOAD_DIR 미지정 시 작업디렉터리의 uploads/ 사용.
#   도커에서는 /app 가 호스트에 바인드 마운트되어 컨테이너 재시작에도 보존된다.
# =================================================
app.upload.dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=60MB

# =================================================
# Redis (최근 1시간 관광지 랭킹)
# =================================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# =================================================
# MyBatis
# =================================================
# mapper XML 위치 (feature 별로 mappers/ 아래 둔다)
mybatis.mapper-locations=classpath:mappers/**/*.xml
# DTO 별칭 자동 등록
mybatis.type-aliases-package=com.tripcrew
# DB snake_case 컬럼 <-> Java camelCase 필드 자동 매핑 (created_at -> createdAt)
mybatis.configuration.map-underscore-to-camel-case=true

# =================================================
# Flyway (DB 마이그레이션)
#   src/main/resources/db/migration/V1__init.sql 부터 순차 적용
# =================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# =================================================
# JWT (F01) - 시크릿/만료는 환경변수로 주입
#   export JWT_SECRET=<base64-256bit-key>
# =================================================
jwt.secret=${JWT_SECRET:}
# access token 만료 (ms) - 기본 30분
jwt.access-token-expiration=${JWT_ACCESS_EXP:1800000}
# refresh token 만료 (ms) - 기본 14일
jwt.refresh-token-expiration=${JWT_REFRESH_EXP:1209600000}

# =================================================
# NAVER Maps Directions 5
#   REST API 키는 프론트에 노출하지 않고 백엔드 환경변수로 주입한다.
# =================================================
naver.maps.client-id=${NAVER_MAP_CLIENT_ID:}
naver.maps.client-secret=${NAVER_MAP_CLIENT_SECRET:}
naver.maps.directions-url=${NAVER_DIRECTIONS_URL:https://maps.apigw.ntruss.com/map-direction/v1/driving}

# =================================================
# Gemini API
gemini.max-output-tokens=${GEMINI_MAX_OUTPUT_TOKENS:1024}
#   API 키는 프론트에 노출하지 않고 백엔드 환경변수로 주입한다.
# =================================================
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.1-flash-lite}
gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}

# =================================================
# OAuth2 소셜 로그인 (Kakao / Naver)
#   - 실제 client-id/secret 는 제공자 콘솔에서 발급 후 환경변수로 주입.
#     미설정(placeholder) 이어도 앱은 기동되며, 그 경우 소셜 로그인만 동작 안 함.
#   - redirect-uri 의 {baseUrl} 은 요청 스킴/호스트로 치환된다(로컬 8080 / 운영 https).
#     운영(Caddy 프록시) 에서 https 로 치환되려면 forward-headers 전략이 필요(아래).
#   - 카카오/네이버는 표준 OIDC 가 아니라 provider 세부정보를 직접 명시한다.
#   - 성공 후 프론트 콜백 베이스: APP_OAUTH_REDIRECT_BASE (운영=https://tripcrew.duckdns.org)
# =================================================
server.forward-headers-strategy=framework
app.oauth2.success-redirect-base=${APP_OAUTH_REDIRECT_BASE:http://localhost:5173}

# --- Kakao ---
#   콘솔에서 Client Secret 을 활성화(ON)했으므로 토큰 요청에 시크릿을 포함해야 한다.
#   (카카오 로그인 줄의 시크릿 코드를 KAKAO_CLIENT_SECRET 에 넣는다.)
spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID:placeholder-kakao}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET:}
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.redirect-uri={baseUrl}/login/oauth2/code/kakao
spring.security.oauth2.client.registration.kakao.scope=profile_nickname,account_email
spring.security.oauth2.client.registration.kakao.client-name=Kakao
spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

# --- Naver ---
spring.security.oauth2.client.registration.naver.client-id=${NAVER_CLIENT_ID:placeholder-naver}
spring.security.oauth2.client.registration.naver.client-secret=${NAVER_CLIENT_SECRET:placeholder-secret}
spring.security.oauth2.client.registration.naver.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.naver.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.naver.redirect-uri={baseUrl}/login/oauth2/code/naver
spring.security.oauth2.client.registration.naver.scope=name,email
spring.security.oauth2.client.registration.naver.client-name=Naver
spring.security.oauth2.client.provider.naver.authorization-uri=https://nid.naver.com/oauth2.0/authorize
spring.security.oauth2.client.provider.naver.token-uri=https://nid.naver.com/oauth2.0/token
spring.security.oauth2.client.provider.naver.user-info-uri=https://openapi.naver.com/v1/nid/me
spring.security.oauth2.client.provider.naver.user-name-attribute=response
